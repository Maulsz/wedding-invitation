<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <linearGradient id="qrisGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#B89A65" />
      <stop offset="100%" stop-color="#8C6D31" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="300" height="360" rx="16" fill="#FFFFFF" stroke="url(#qrisGold)" stroke-width="2"/>

  <!-- Top QRIS Banner -->
  <path d="M 0 16 C 0 7.2 7.2 0 16 0 L 284 0 C 292.8 0 300 7.2 300 16 L 300 64 L 0 64 Z" fill="#354B3D"/>
  <text x="150" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">QRIS</text>
  <text x="150" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E4E7DC" text-anchor="middle" letter-spacing="1">STANDAR PEMBAYARAN NASIONAL</text>

  <!-- Merchant Name -->
  <text x="150" y="90" font-family="'Playfair Display', serif" font-size="16" font-weight="700" fill="#354B3D" text-anchor="middle">Ahmad &amp; Aisyah</text>
  <text x="150" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#8C8C7E" text-anchor="middle">NMID: ID102600012345678 (Contoh Demo)</text>

  <!-- Stylized QR Code Box -->
  <g transform="translate(50, 120)">
    <!-- Outer QR Frame -->
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#FAF7F2" stroke="#B89A65" stroke-width="1.2"/>

    <!-- Position Finder Pattern: Top-Left -->
    <rect x="15" y="15" width="46" height="46" rx="4" fill="none" stroke="#354B3D" stroke-width="6"/>
    <rect x="25" y="25" width="26" height="26" rx="2" fill="#354B3D"/>

    <!-- Position Finder Pattern: Top-Right -->
    <rect x="139" y="15" width="46" height="46" rx="4" fill="none" stroke="#354B3D" stroke-width="6"/>
    <rect x="149" y="25" width="26" height="26" rx="2" fill="#354B3D"/>

    <!-- Position Finder Pattern: Bottom-Left -->
    <rect x="15" y="139" width="46" height="46" rx="4" fill="none" stroke="#354B3D" stroke-width="6"/>
    <rect x="25" y="149" width="26" height="26" rx="2" fill="#354B3D"/>

    <!-- Geometric QR Dots / Modules (Clean Decorative Pattern) -->
    <g fill="#354B3D">
      <rect x="72" y="18" width="10" height="10" rx="1"/>
      <rect x="90" y="18" width="10" height="10" rx="1"/>
      <rect x="108" y="18" width="10" height="10" rx="1"/>
      <rect x="72" y="36" width="10" height="10" rx="1"/>
      <rect x="118" y="36" width="10" height="10" rx="1"/>
      <rect x="90" y="54" width="10" height="10" rx="1"/>

      <rect x="18" y="72" width="10" height="10" rx="1"/>
      <rect x="36" y="72" width="10" height="10" rx="1"/>
      <rect x="72" y="72" width="10" height="10" rx="1"/>
      <rect x="90" y="72" width="10" height="10" rx="1"/>
      <rect x="108" y="72" width="10" height="10" rx="1"/>
      <rect x="136" y="72" width="10" height="10" rx="1"/>
      <rect x="154" y="72" width="10" height="10" rx="1"/>
      <rect x="172" y="72" width="10" height="10" rx="1"/>

      <rect x="18" y="90" width="10" height="10" rx="1"/>
      <rect x="54" y="90" width="10" height="10" rx="1"/>
      <rect x="72" y="90" width="10" height="10" rx="1"/>
      <rect x="118" y="90" width="10" height="10" rx="1"/>
      <rect x="154" y="90" width="10" height="10" rx="1"/>

      <rect x="36" y="108" width="10" height="10" rx="1"/>
      <rect x="72" y="108" width="10" height="10" rx="1"/>
      <rect x="90" y="108" width="10" height="10" rx="1"/>
      <rect x="136" y="108" width="10" height="10" rx="1"/>
      <rect x="172" y="108" width="10" height="10" rx="1"/>

      <rect x="72" y="136" width="10" height="10" rx="1"/>
      <rect x="108" y="136" width="10" height="10" rx="1"/>
      <rect x="136" y="136" width="10" height="10" rx="1"/>
      <rect x="154" y="136" width="10" height="10" rx="1"/>

      <rect x="90" y="154" width="10" height="10" rx="1"/>
      <rect x="118" y="154" width="10" height="10" rx="1"/>
      <rect x="154" y="154" width="10" height="10" rx="1"/>
      <rect x="172" y="154" width="10" height="10" rx="1"/>

      <rect x="72" y="172" width="10" height="10" rx="1"/>
      <rect x="90" y="172" width="10" height="10" rx="1"/>
      <rect x="136" y="172" width="10" height="10" rx="1"/>
    </g>

    <!-- Center Islamic Emblem -->
    <rect x="85" y="85" width="30" height="30" rx="6" fill="#B89A65"/>
    <circle cx="100" cy="100" r="10" fill="#FFFFFF"/>
    <circle cx="100" cy="100" r="4" fill="#354B3D"/>
  </g>

  <!-- Bottom Helper Note -->
  <text x="150" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#B89A65" text-anchor="middle">Pindai menggunakan aplikasi m-Banking / E-Wallet</text>
</svg>

