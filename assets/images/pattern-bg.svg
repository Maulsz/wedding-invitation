<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <style>
      .pat { fill: none; stroke: #B89A65; stroke-width: 0.7; stroke-opacity: 0.12; }
      .pat-accent { fill: none; stroke: #A6AA91; stroke-width: 0.5; stroke-opacity: 0.10; }
    </style>
  </defs>
  <!-- 8-point Islamic star geometric repeat -->
  <rect x="0" y="0" width="80" height="80" fill="none"/>
  
  <!-- Intersecting octagons / squares -->
  <polygon class="pat" points="40,4 47.6,22.4 65.4,14.6 57.6,32.4 76,40 57.6,47.6 65.4,65.4 47.6,57.6 40,76 32.4,57.6 14.6,65.4 22.4,47.6 4,40 22.4,32.4 14.6,14.6 32.4,22.4"/>
  <circle class="pat-accent" cx="40" cy="40" r="12"/>
  <circle class="pat" cx="40" cy="40" r="2.5"/>

  <!-- Corner quarter stars -->
  <circle class="pat" cx="0" cy="0" r="14"/>
  <circle class="pat" cx="80" cy="0" r="14"/>
  <circle class="pat" cx="0" cy="80" r="14"/>
  <circle class="pat" cx="80" cy="80" r="14"/>
  <line class="pat-accent" x1="0" y1="0" x2="80" y2="80"/>
  <line class="pat-accent" x1="80" y1="0" x2="0" y2="80"/>
</svg>

