<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#B89A65" />
      <stop offset="100%" stop-color="#8C6D31" />
    </linearGradient>
  </defs>

  <!-- Corner Border Lines -->
  <path d="M 8 90 L 8 16 C 8 11.5, 11.5 8, 16 8 L 90 8" fill="none" stroke="url(#cornerGold)" stroke-width="1.5"/>
  <path d="M 14 75 L 14 20 C 14 16.7, 16.7 14, 20 14 L 75 14" fill="none" stroke="url(#cornerGold)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Floral Corner Leaf Flourish -->
  <g stroke="none">
    <!-- Main Corner Blossom -->
    <circle cx="28" cy="28" r="4.5" fill="url(#cornerGold)"/>
    <circle cx="28" cy="28" r="2" fill="#F8F5EF"/>

    <!-- Leaves radiating -->
    <path d="M 28 22 C 26 14, 34 10, 38 16 C 39 19, 34 21, 28 22 Z" fill="#A6AA91" opacity="0.9"/>
    <path d="M 22 28 C 14 26, 10 34, 16 38 C 19 39, 21 34, 22 28 Z" fill="#A6AA91" opacity="0.9"/>
    <path d="M 32 32 C 40 40, 48 34, 44 26 C 41 24, 36 28, 32 32 Z" fill="url(#cornerGold)" opacity="0.85"/>
    <path d="M 32 24 C 42 18, 52 24, 46 30 C 42 32, 36 28, 32 24 Z" fill="#354B3D" opacity="0.75"/>
    <path d="M 24 32 C 18 42, 24 52, 30 46 C 32 42, 28 36, 24 32 Z" fill="#354B3D" opacity="0.75"/>

    <!-- Small Accent Beads -->
    <circle cx="56" cy="18" r="2" fill="url(#cornerGold)"/>
    <circle cx="18" cy="56" r="2" fill="url(#cornerGold)"/>
    <circle cx="48" cy="48" r="2.5" fill="url(#cornerGold)"/>
  </g>
</svg>

