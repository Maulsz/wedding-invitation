<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="30%" stop-color="#F5E8C7" />
      <stop offset="70%" stop-color="#B89A65" />
      <stop offset="100%" stop-color="#8C6D31" />
    </linearGradient>
    <pattern id="islamicLattice" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 0 L24 12 L12 24 L0 12 Z" fill="none" stroke="#B89A65" stroke-width="0.5" opacity="0.18"/>
      <circle cx="12" cy="12" r="3" fill="none" stroke="#B89A65" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background subtle pattern -->
  <rect x="15" y="15" width="470" height="670" rx="20" fill="url(#islamicLattice)" opacity="0.6"/>

  <!-- Outer Rectangular Border -->
  <rect x="15" y="15" width="470" height="670" rx="16" fill="none" stroke="url(#archGold)" stroke-width="2"/>
  <rect x="22" y="22" width="456" height="656" rx="12" fill="none" stroke="url(#archGold)" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.75"/>

  <!-- Mihrab Pointed Arch -->
  <!-- Outer Arch path: begins from bottom left, goes up to shoulder, curves into pointed ogee peak -->
  <path d="
    M 38 660 
    L 38 230 
    C 38 180, 80 140, 150 110 
    C 195 90, 230 55, 250 28 
    C 270 55, 305 90, 350 110 
    C 420 140, 462 180, 462 230 
    L 462 660
    Z" 
    fill="none" stroke="url(#archGold)" stroke-width="1.8"/>

  <!-- Inner Arch path -->
  <path d="
    M 46 652 
    L 46 232 
    C 46 186, 85 148, 152 119 
    C 195 100, 230 68, 250 42 
    C 270 68, 305 100, 348 119 
    C 415 148, 454 186, 454 232 
    L 454 652" 
    fill="none" stroke="url(#archGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.85"/>

  <!-- Mihrab Keystone / Finial at Top -->
  <g transform="translate(250, 28)">
    <circle cx="0" cy="-6" r="4" fill="url(#archGold)"/>
    <path d="M 0 -10 L 0 -18 M -4 -14 L 4 -14" stroke="url(#archGold)" stroke-width="1.2"/>
    <circle cx="0" cy="-18" r="2" fill="url(#archGold)"/>
  </g>

  <!-- Corner arabesque motifs -->
  <!-- Top Left -->
  <path d="M 28 28 Q 50 28 50 50" fill="none" stroke="url(#archGold)" stroke-width="1.2"/>
  <circle cx="34" cy="34" r="2" fill="url(#archGold)"/>
  <!-- Top Right -->
  <path d="M 472 28 Q 450 28 450 50" fill="none" stroke="url(#archGold)" stroke-width="1.2"/>
  <circle cx="466" cy="34" r="2" fill="url(#archGold)"/>
  <!-- Bottom Left -->
  <path d="M 28 672 Q 50 672 50 650" fill="none" stroke="url(#archGold)" stroke-width="1.2"/>
  <circle cx="34" cy="666" r="2" fill="url(#archGold)"/>
  <!-- Bottom Right -->
  <path d="M 472 672 Q 450 672 450 650" fill="none" stroke="url(#archGold)" stroke-width="1.2"/>
  <circle cx="466" cy="666" r="2" fill="url(#archGold)"/>
</svg>

