<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 40" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89A65" stop-opacity="0" />
      <stop offset="25%" stop-color="#B89A65" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="1" />
      <stop offset="75%" stop-color="#B89A65" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B89A65" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Line -->
  <line x1="20" y1="20" x2="115" y2="20" stroke="url(#divGold)" stroke-width="1.2"/>
  <circle cx="118" cy="20" r="2" fill="#B89A65"/>

  <!-- Right Line -->
  <circle cx="182" cy="20" r="2" fill="#B89A65"/>
  <line x1="185" y1="20" x2="280" y2="20" stroke="url(#divGold)" stroke-width="1.2"/>

  <!-- Center Motif (Floral & Diamond) -->
  <g transform="translate(150, 20)">
    <!-- Central Diamond -->
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#D4AF37"/>
    <circle cx="0" cy="0" r="2" fill="#F8F5EF"/>

    <!-- Petals / Leaves -->
    <path d="M 0 -8 C -4 -16, -14 -10, -8 -4 C -4 -1, -1 -3, 0 -8 Z" fill="#B89A65" opacity="0.85"/>
    <path d="M 0 -8 C 4 -16, 14 -10, 8 -4 C 4 -1, 1 -3, 0 -8 Z" fill="#B89A65" opacity="0.85"/>
    <path d="M 0 8 C -4 16, -14 10, -8 4 C -4 1, -1 3, 0 8 Z" fill="#B89A65" opacity="0.85"/>
    <path d="M 0 8 C 4 16, 14 10, 8 4 C 4 1, 1 3, 0 8 Z" fill="#B89A65" opacity="0.85"/>

    <!-- Small Accent Dots -->
    <circle cx="-16" cy="0" r="1.5" fill="#D4AF37"/>
    <circle cx="16" cy="0" r="1.5" fill="#D4AF37"/>
  </g>
</svg>

